# hotjob nginx config -- place at /etc/nginx/sites-available/hotjob
server {
    listen 80;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1000;
    gzip_comp_level 5;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=50r/s;

    # Static files (served directly by nginx)
    location /favicon.ico { root /app/web; expires 30d; add_header Cache-Control "public, immutable"; }
    location /favicon- { root /app/web; expires 30d; add_header Cache-Control "public, immutable"; }
    location /apple-touch-icon.png { root /app/web; expires 30d; add_header Cache-Control "public, immutable"; }

    # API proxy
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Everything else -> app
    location / {
        limit_req zone=static burst=30;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
