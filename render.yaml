# Render Blueprint — hotjob
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hotjob
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web/app.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
    healthCheckPath: /api/health
    autoDeploy: true
