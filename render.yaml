# Render Blueprint — hotjob
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hotjob
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd web && python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
    healthCheckPath: /api/health
    autoDeploy: true
